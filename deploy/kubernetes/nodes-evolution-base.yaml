apiVersion: v1
kind: Namespace
metadata:
  name: nodes-evolution
  labels:
    app.kubernetes.io/part-of: nodes-ai-canvas
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-candidate-network
  namespace: nodes-evolution
spec:
  podSelector:
    matchLabels:
      nodes.ai/network: deny-all
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: v1
kind: LimitRange
metadata:
  name: candidate-defaults
  namespace: nodes-evolution
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "2"
        memory: 2Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: candidate-budget
  namespace: nodes-evolution
spec:
  hard:
    pods: "32"
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
