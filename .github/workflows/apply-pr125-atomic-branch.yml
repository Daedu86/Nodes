name: Apply PR 125 atomic branch fix

on:
  push:
    branches:
      - maintenance/final-dependency-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: maintenance/final-dependency-integration
          fetch-depth: 0

      - name: Make branch append and run atomic
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          runtime_path = Path("lib/thread-branching-runtime.ts")
          runtime = runtime_path.read_text()
          old = '''  // Branch submissions are deliberately split into two explicit runtime actions.
            // Relying on CreateAppendMessage.startRun for an off-head branch can append the
            // optimistic user message without starting the AI SDK transport. That leaves the
            // Canvas transaction waiting forever for a runEnd event that will never arrive.
            // Append first with auto-run disabled, then start the run against the known new
            // user-message id so every branch path uses the same deterministic lifecycle.
            const shouldStartRun = message.startRun;
            const appendMessage = shouldStartRun ? { ...message, startRun: false } : message;

            // assistant-ui's public ThreadRuntime.append coerces `parentId: null` into the
            // current head message. Only root-level branching needs the internal append to
            // preserve `null`; non-root branches use the public append so the new branch is
            // registered through the supported runtime surface.
            if (appendMessage.parentId === null) {
              const internalState = (threadRuntime as InternalThreadRuntime).__internal_threadBinding?.getState?.();
              const internalAppend =
                internalState && typeof internalState.append === "function"
                  ? internalState.append.bind(internalState)
                  : null;

              if (internalAppend) {
                internalAppend(appendMessage);
              } else {
                threadRuntime.append(appendMessage);
              }
            } else {
              threadRuntime.append(appendMessage);
            }

            if (shouldStartRun) {
              const startBranchRun = () => {
                threadRuntime.startRun({
                  parentId: message.id,
                  sourceId: message.sourceId,
                  runConfig: message.runConfig,
                });
              };

              // In the browser, assistant-ui publishes the appended message through
              // React state. Starting the transport in the same call stack can race
              // that publication and produce "Message not found" for off-head branches.
              // Two animation frames let the runtime commit the append before the run
              // resolves its parent. Non-browser callers stay synchronous for tests and
              // server-side utilities.
              if (
                typeof window !== "undefined" &&
                typeof window.requestAnimationFrame === "function"
              ) {
                window.requestAnimationFrame(() => {
                  window.requestAnimationFrame(startBranchRun);
                });
              } else {
                startBranchRun();
              }
            }
          '''
          new = '''  // Let assistant-ui append the branch message and start its run as one
            // runtime transaction. Calling startRun separately can race the repository
            // publication of the appended message and produce "Message not found" for
            // off-head branches.
            const appendMessage = message;

            // assistant-ui's public ThreadRuntime.append coerces `parentId: null` into the
            // current head message. Only root-level branching needs the internal append to
            // preserve `null`; non-root branches use the public append so the new branch is
            // registered through the supported runtime surface.
            if (appendMessage.parentId === null) {
              const internalState = (threadRuntime as InternalThreadRuntime).__internal_threadBinding?.getState?.();
              const internalAppend =
                internalState && typeof internalState.append === "function"
                  ? internalState.append.bind(internalState)
                  : null;

              if (internalAppend) {
                internalAppend(appendMessage);
              } else {
                threadRuntime.append(appendMessage);
              }
            } else {
              threadRuntime.append(appendMessage);
            }
          '''
          assert old in runtime, "executeBranchSpec lifecycle block changed"
          runtime_path.write_text(runtime.replace(old, new, 1))

          test_path = Path("tests/thread-branching-runtime.test.ts")
          tests = test_path.read_text()
          tests = tests.replace(
            'it("uses the internal runtime append for root branches and starts the run explicitly", () => {',
            'it("uses the internal runtime append as one atomic root branch transaction", () => {',
            1,
          )
          tests = tests.replace(
            '''        startRun: false,
              }),
            );
            expect(startRun).toHaveBeenCalledTimes(1);
            expect(startRun).toHaveBeenCalledWith({
              parentId: appended.id,
              sourceId: null,
              runConfig: appended.runConfig,
            });
          ''',
            '''        startRun: true,
              }),
            );
            expect(startRun).not.toHaveBeenCalled();
          ''',
            1,
          )
          tests = tests.replace(
            'it("uses public append then explicit startRun for non-root full-tree runs", () => {',
            'it("uses public append as one atomic non-root full-tree transaction", () => {',
            1,
          )
          tests = tests.replace(
            '''        startRun: false,
                metadata: {
          ''',
            '''        startRun: true,
                metadata: {
          ''',
            1,
          )
          tests = tests.replace(
            '''    expect(startRun).toHaveBeenCalledTimes(1);
            expect(startRun).toHaveBeenCalledWith({
              parentId: appended.id,
              sourceId: "assistant-node-1",
              runConfig: appended.runConfig,
            });
          ''',
            '''    expect(startRun).not.toHaveBeenCalled();
          ''',
            1,
          )
          tests = tests.replace(
            'it("falls back to public append for root branches and still explicitly starts once", () => {',
            'it("falls back to public append while keeping the root run atomic", () => {',
            1,
          )
          tests = tests.replace(
            '''        startRun: false,
              }),
            );
            expect(startRun).toHaveBeenCalledTimes(1);
            expect(startRun).toHaveBeenCalledWith({
              parentId: appended.id,
              sourceId: null,
              runConfig: appended.runConfig,
            });
          ''',
            '''        startRun: true,
              }),
            );
            expect(startRun).not.toHaveBeenCalled();
          ''',
            1,
          )
          test_path.write_text(tests)

          Path(".github/workflows/apply-pr125-atomic-branch.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/thread-branching-runtime.ts tests/thread-branching-runtime.test.ts .github/workflows/apply-pr125-atomic-branch.yml
          git commit -m "fix: make chat branch append and run atomic"
          git push origin HEAD:maintenance/final-dependency-integration
