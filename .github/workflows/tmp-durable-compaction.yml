name: Temporary durable compaction validation

on:
  push:
    branches:
      - feat/durable-context-compaction
    paths:
      - .github/workflows/tmp-durable-compaction.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/durable-context-compaction
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Write validated implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payloads = {
            "lib/agents/kernel/session-log.ts": "",
            "lib/agents/kernel/context-compaction.ts": "",
            "lib/server/agent-session-journal.ts": "",
            "tests/agent-context-compaction-durable.test.ts": ""
          }

          for path, payload in payloads.items():
              destination = Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Validate implementation
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npx eslint \
            lib/agents/kernel/session-log.ts \
            lib/agents/kernel/context-compaction.ts \
            lib/server/agent-session-journal.ts \
            tests/agent-context-compaction-durable.test.ts \
            --max-warnings=0
          npx vitest run \
            tests/agent-session-log.test.ts \
            tests/agent-session-journal.test.ts \
            tests/agent-context-compaction-durable.test.ts
          git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-durable-compaction.yml
          git add -- \
            lib/agents/kernel/session-log.ts \
            lib/agents/kernel/context-compaction.ts \
            lib/server/agent-session-journal.ts \
            tests/agent-context-compaction-durable.test.ts
          git diff --cached --check
          git commit -m "feat(agents): add durable context-aware compaction"
          git push origin HEAD:feat/durable-context-compaction
