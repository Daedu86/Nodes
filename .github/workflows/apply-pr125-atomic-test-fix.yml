name: Apply PR 125 atomic test fix

on:
  push:
    branches:
      - maintenance/final-dependency-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: maintenance/final-dependency-integration
          fetch-depth: 0

      - name: Align runtime unit tests with atomic append
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("tests/thread-branching-runtime.test.ts")
          source = path.read_text()

          blocks = [
            (
              '''        sourceId: null,
                      startRun: false,
                    }),
                  );
                  expect(startRun).toHaveBeenCalledTimes(1);
                  expect(startRun).toHaveBeenCalledWith({
                    parentId: appended.id,
                    sourceId: null,
                    runConfig: appended.runConfig,
                  });''',
              '''        sourceId: null,
                      startRun: true,
                    }),
                  );
                  expect(startRun).not.toHaveBeenCalled();''',
            ),
            (
              '''        parentId: "assistant-node-1",
                      startRun: false,
                      metadata:''',
              '''        parentId: "assistant-node-1",
                      startRun: true,
                      metadata:''',
            ),
            (
              '''    expect(startRun).toHaveBeenCalledTimes(1);
                  expect(startRun).toHaveBeenCalledWith({
                    parentId: appended.id,
                    sourceId: "assistant-node-1",
                    runConfig: appended.runConfig,
                  });''',
              '''    expect(startRun).not.toHaveBeenCalled();''',
            ),
            (
              '''        parentId: null,
                      role: "user",
                      startRun: false,
                    }),
                  );
                  expect(startRun).toHaveBeenCalledTimes(1);
                  expect(startRun).toHaveBeenCalledWith({
                    parentId: appended.id,
                    sourceId: null,
                    runConfig: appended.runConfig,
                  });''',
              '''        parentId: null,
                      role: "user",
                      startRun: true,
                    }),
                  );
                  expect(startRun).not.toHaveBeenCalled();''',
            ),
          ]

          for old, new in blocks:
            assert old in source, f"Expected assertion block not found: {old[:60]!r}"
            source = source.replace(old, new, 1)

          path.write_text(source)
          Path(".github/workflows/apply-pr125-atomic-test-fix.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/thread-branching-runtime.test.ts .github/workflows/apply-pr125-atomic-test-fix.yml
          git commit -m "test: assert atomic branch runtime contract"
          git push origin HEAD:maintenance/final-dependency-integration
