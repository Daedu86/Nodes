name: M1 Durable Validation

on:
  push:
    branches: [feature/tycho-durable-episode-orchestrator]

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  VERCEL_ENV: preview
  NODES_PERSISTENCE_BACKEND: file
  AUTH_ENABLE_DEV_CREDENTIALS: "0"
  OPENROUTER_ALLOW_DEPLOYMENT_KEY: "0"
  OPENROUTER_REQUIRE_USER_KEY: "1"

jobs:
  durable-m1:
    name: Durable M1 final validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Format and lint
        run: npm run format:check
      - name: Runner syntax
        run: npm --prefix services/codex-runner run check
      - name: Runner unit tests
        run: npm --prefix services/codex-runner test
      - name: Application type check
        run: npm run typecheck
      - name: Durable lifecycle unit test
        run: npm test -- tests/durable-evolution-snapshot.test.ts
      - name: Evolution regression tests
        run: npm test -- tests/tycho-evolution-loop.test.ts tests/tycho-evolution-loop-budget.test.ts tests/tycho-evolution-session.test.ts tests/codex-evolution-variant-generator.test.ts
      - name: Production build
        run: npm run build
