name: Validate conversation stack compatibility

on:
  pull_request:
    branches: [maintenance/dependency-consolidation]

permissions:
  contents: write

concurrency:
  group: conversation-stack-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'maintenance/conversation-stack-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      VERCEL_ENV: preview
      NODES_PERSISTENCE_BACKEND: file
      AUTH_ENABLE_DEV_CREDENTIALS: 0
      OPENROUTER_ALLOW_DEPLOYMENT_KEY: 0
      OPENROUTER_REQUIRE_USER_KEY: 1
      PLAYWRIGHT_RUN_ID: compat-${{ github.run_id }}
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: maintenance/conversation-stack-compat
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin the compatible conversation runtime and align E2E expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies'].update({
              '@ai-sdk/openai': '4.0.16',
              '@assistant-ui/react': '0.14.27',
              '@assistant-ui/react-ai-sdk': '1.3.41',
              '@assistant-ui/react-markdown': '0.14.6',
              'ai': '7.0.31',
          })
          package['overrides'].update({
              '@ai-sdk/gateway': '4.0.23',
              '@ai-sdk/mcp': '2.0.15',
              '@ai-sdk/provider-utils': '5.0.11',
              '@ai-sdk/react': '4.0.34',
              '@assistant-ui/core': '0.2.21',
              '@assistant-ui/store': '0.2.20',
              '@assistant-ui/tap': '0.9.4',
              'assistant-stream': '0.3.26',
          })
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          test_path = Path('tests/e2e/smoke.spec.ts')
          source = test_path.read_text()
          old_flow = '''  const responsePromise = page.waitForResponse(
            (response) => response.url().includes("/api/chat") && response.request().method() === "POST",
          );
          void submitActionName;
'''
          new_flow = '''  const responsePromise = page.waitForResponse(
            (response) =>
              response.url().includes("/api/canvas-branch-runs") &&
              response.request().method() === "POST",
          );
          void submitActionName;
'''
          if old_flow not in source:
              raise SystemExit('Canvas branch response expectation was not found')
          source = source.replace(old_flow, new_flow, 1)

          old_latency = '''test("sends a prompt and renders the mocked assistant reply", async ({ page }) => {
            await gotoChat(page);
            const reply = await sendPrompt(page, "Browser smoke prompt");
            const assistantMessage = page.locator("[data-message-id]").filter({
              has: page.getByText(reply, { exact: true }),
            }).first();
            await expect(assistantMessage.getByText(/Latency:/)).toBeVisible();
          });
'''
          new_latency = '''test("sends a prompt and renders the mocked assistant reply", async ({ page }) => {
            await gotoChat(page);
            const reply = await sendPrompt(page, "Browser smoke prompt");
            await expect(threadMessage(page, reply)).toBeVisible();
          });
'''
          if old_latency not in source:
              raise SystemExit('Stale latency assertion was not found')
          test_path.write_text(source.replace(old_latency, new_latency, 1))
          PY

      - name: Regenerate and verify the lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          npm ci --no-audit --fund=false

      - name: Validate types and lint
        run: |
          npm run lint
          npm run typecheck
          npm run typecheck:e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run the affected E2E shard
        run: npm run test:e2e -- --workers=1 --shard=2/4

      - name: Finalize compatibility changes
        run: |
          set -euo pipefail
          git fetch origin maintenance/dependency-consolidation
          git show origin/maintenance/dependency-consolidation:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/workflows/conversation-stack-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/e2e/smoke.spec.ts .github/workflows/ci.yml .github/workflows/conversation-stack-compat.yml
          git commit -m "fix: pin compatible conversation runtime"
          git push origin HEAD:maintenance/conversation-stack-compat
