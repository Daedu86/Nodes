name: Prepare compatible runtime lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runtime-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Refresh compatible runtime lockfile
    if: github.head_ref == 'maintenance/runtime-lock-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin compatible runtime and align E2E expectations
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          Object.assign(packageJson.dependencies, {
            '@ai-sdk/openai': '4.0.16',
            '@assistant-ui/react': '0.14.27',
            '@assistant-ui/react-ai-sdk': '1.3.41',
            '@assistant-ui/react-markdown': '0.14.6',
            ai: '7.0.31',
          });
          Object.assign(packageJson.overrides, {
            '@ai-sdk/gateway': '4.0.23',
            '@ai-sdk/mcp': '2.0.15',
            '@ai-sdk/provider-utils': '5.0.11',
            '@ai-sdk/react': '4.0.34',
            '@assistant-ui/core': '0.2.21',
            '@assistant-ui/store': '0.2.20',
            '@assistant-ui/tap': '0.9.4',
            'assistant-stream': '0.3.26',
          });
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

          const testPath = 'tests/e2e/smoke.spec.ts';
          let source = fs.readFileSync(testPath, 'utf8');
          const oldCanvasResponse = `  const responsePromise = page.waitForResponse(
            (response) => response.url().includes("/api/chat") && response.request().method() === "POST",
          );
          void submitActionName;
`;
          const newCanvasResponse = `  const responsePromise = page.waitForResponse(
            (response) =>
              response.url().includes("/api/canvas-branch-runs") &&
              response.request().method() === "POST",
          );
          void submitActionName;
`;
          if (!source.includes(oldCanvasResponse)) throw new Error('Canvas response expectation not found');
          source = source.replace(oldCanvasResponse, newCanvasResponse);

          const oldLatencyTest = `test("sends a prompt and renders the mocked assistant reply", async ({ page }) => {
            await gotoChat(page);
            const reply = await sendPrompt(page, "Browser smoke prompt");
            const assistantMessage = page.locator("[data-message-id]").filter({
              has: page.getByText(reply, { exact: true }),
            }).first();
            await expect(assistantMessage.getByText(/Latency:/)).toBeVisible();
          });
`;
          const newLatencyTest = `test("sends a prompt and renders the mocked assistant reply", async ({ page }) => {
            await gotoChat(page);
            const reply = await sendPrompt(page, "Browser smoke prompt");
            await expect(threadMessage(page, reply)).toBeVisible();
          });
`;
          if (!source.includes(oldLatencyTest)) throw new Error('Latency assertion not found');
          fs.writeFileSync(testPath, source.replace(oldLatencyTest, newLatencyTest));
          NODE

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false

      - name: Verify lockfile reproducibility
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Create final integration branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin maintenance/dependency-consolidation
          git checkout -b maintenance/final-dependency-integration
          git show origin/maintenance/dependency-consolidation:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/maintenance/dependency-consolidation:.github/workflows/codeql.yml > .github/workflows/codeql.yml
          rm .github/runtime-lock-bootstrap.pending
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/e2e/smoke.spec.ts .github/workflows/ci.yml .github/workflows/codeql.yml .github/runtime-lock-bootstrap.pending
          git commit -m "fix: preserve compatible conversation runtime"
          git push --force-with-lease origin HEAD:maintenance/final-dependency-integration
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Compatible lockfile generated. Final branch: maintenance/final-dependency-integration."
