name: Prepare dependency consolidation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Refresh and validate package lock
    if: github.head_ref == 'maintenance/dependency-lock-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false

      - name: Verify lockfile reproducibility
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Create final consolidation branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -b maintenance/dependency-consolidation
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/lock-refresh.pending
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml .github/lock-refresh.pending
          git commit -m "chore: finalize dependency consolidation"
          git push --force-with-lease origin HEAD:maintenance/dependency-consolidation
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Lockfile regenerated and validated. The final integration branch is maintenance/dependency-consolidation."
