name: Prepare compatible runtime lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runtime-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  VERCEL_ENV: preview
  NODES_PERSISTENCE_BACKEND: file
  AUTH_ENABLE_DEV_CREDENTIALS: "0"
  OPENROUTER_ALLOW_DEPLOYMENT_KEY: "0"
  OPENROUTER_REQUIRE_USER_KEY: "1"
  PLAYWRIGHT_RUN_ID: runtime-lock-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    name: Regenerate and validate compatible runtime
    if: github.head_ref == 'maintenance/runtime-lock-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: maintenance/runtime-lock-bootstrap
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin compatible conversation runtime and align E2E expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["dependencies"].update({
              "@ai-sdk/openai": "4.0.16",
              "@assistant-ui/react": "0.14.27",
              "@assistant-ui/react-ai-sdk": "1.3.41",
              "@assistant-ui/react-markdown": "0.14.6",
              "ai": "7.0.31",
          })
          package["overrides"].update({
              "@ai-sdk/gateway": "4.0.23",
              "@ai-sdk/mcp": "2.0.15",
              "@ai-sdk/provider-utils": "5.0.11",
              "@ai-sdk/react": "4.0.34",
              "@assistant-ui/core": "0.2.21",
              "@assistant-ui/store": "0.2.20",
              "@assistant-ui/tap": "0.9.4",
              "assistant-stream": "0.3.26",
          })
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          test_path = Path("tests/e2e/smoke.spec.ts")
          source = test_path.read_text()
          old_canvas_response = '''  const responsePromise = page.waitForResponse(
            (response) => response.url().includes("/api/chat") && response.request().method() === "POST",
          );
          void submitActionName;
'''
          new_canvas_response = '''  const responsePromise = page.waitForResponse(
            (response) =>
              response.url().includes("/api/canvas-branch-runs") &&
              response.request().method() === "POST",
          );
          void submitActionName;
'''
          if old_canvas_response not in source:
              raise SystemExit("Canvas branch response expectation was not found")
          source = source.replace(old_canvas_response, new_canvas_response, 1)

          old_latency_test = '''test("sends a prompt and renders the mocked assistant reply", async ({ page }) => {
            await gotoChat(page);
            const reply = await sendPrompt(page, "Browser smoke prompt");
            const assistantMessage = page.locator("[data-message-id]").filter({
              has: page.getByText(reply, { exact: true }),
            }).first();
            await expect(assistantMessage.getByText(/Latency:/)).toBeVisible();
          });
'''
          new_latency_test = '''test("sends a prompt and renders the mocked assistant reply", async ({ page }) => {
            await gotoChat(page);
            const reply = await sendPrompt(page, "Browser smoke prompt");
            await expect(threadMessage(page, reply)).toBeVisible();
          });
'''
          if old_latency_test not in source:
              raise SystemExit("Stale latency assertion was not found")
          test_path.write_text(source.replace(old_latency_test, new_latency_test, 1))
          PY

      - name: Regenerate and verify package lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          npm ci --no-audit --fund=false

      - name: Validate lint and types
        run: |
          npm run format:check
          npm run typecheck
          npm run typecheck:e2e

      - name: Run affected unit tests
        run: >-
          npx vitest run
          tests/thread-branching-runtime.test.ts
          tests/chat-route.test.ts
          tests/canvas-branch-direct-run.test.ts
          tests/agent-work-workspace.test.tsx

      - name: Validate production build and bundle budget
        run: npm run build:budget

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run affected E2E shards
        run: |
          npm run test:e2e -- --workers=1 --shard=1/4
          npm run test:e2e -- --workers=1 --shard=2/4

      - name: Create clean final integration branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin maintenance/dependency-consolidation
          git checkout -b maintenance/final-dependency-integration
          git show origin/maintenance/dependency-consolidation:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/maintenance/dependency-consolidation:.github/workflows/codeql.yml > .github/workflows/codeql.yml
          rm .github/runtime-lock-bootstrap.pending
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/e2e/smoke.spec.ts .github/workflows/ci.yml .github/workflows/codeql.yml .github/runtime-lock-bootstrap.pending
          git commit -m "fix: preserve compatible conversation runtime"
          git push --force-with-lease origin HEAD:maintenance/final-dependency-integration
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Compatible lockfile generated and affected runtime checks passed. Final branch: maintenance/final-dependency-integration."

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-lock-bootstrap-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3
