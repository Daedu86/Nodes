name: Prepare compatible runtime lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runtime-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Refresh and verify compatible runtime lockfile
    if: github.head_ref == 'maintenance/runtime-lock-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Prepare compatible runtime inputs
        run: node scripts/prepare-runtime-lock.mjs

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false

      - name: Verify lockfile reproducibility
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Create final integration branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin maintenance/dependency-consolidation
          git checkout -b maintenance/final-dependency-integration
          git show origin/maintenance/dependency-consolidation:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/maintenance/dependency-consolidation:.github/workflows/codeql.yml > .github/workflows/codeql.yml
          rm .github/runtime-lock-bootstrap.pending scripts/prepare-runtime-lock.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/e2e/smoke.spec.ts .github/workflows/ci.yml .github/workflows/codeql.yml .github/runtime-lock-bootstrap.pending scripts/prepare-runtime-lock.mjs
          git commit -m "fix: preserve compatible conversation runtime"
          git push --force-with-lease origin HEAD:maintenance/final-dependency-integration
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Compatible lockfile generated and verified. Final branch: maintenance/final-dependency-integration."
