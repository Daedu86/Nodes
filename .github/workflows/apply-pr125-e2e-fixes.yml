name: Apply PR 125 E2E fixes

on:
  push:
    branches:
      - maintenance/final-dependency-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: maintenance/final-dependency-integration
          fetch-depth: 0

      - name: Patch E2E expectations and helpers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("tests/e2e/smoke.spec.ts")
          source = path.read_text()

          old = '''async function copyGraphJson(page: Page) {
            page.once("dialog", async (dialog) => {
              await dialog.accept();
            });

            const blockLibrary = page.getByRole("complementary", { name: "Block library" });
            const collapseBlockLibrary = blockLibrary.getByRole("button", {
              name: "Collapse block library",
            });
            if (await collapseBlockLibrary.isVisible().catch(() => false)) {
              await collapseBlockLibrary.click();
              await expect(
                blockLibrary.getByRole("button", { name: "Expand block library" }),
              ).toBeVisible();
            }

            await page.getByRole("button", { name: "Fit View" }).click();
            const copyJsonButton = page.getByRole("button", { name: "Copy JSON" });
            await copyJsonButton.focus();
            await page.keyboard.press("Enter");
            await expect
              .poll(async () => page.evaluate(async () => navigator.clipboard.readText()), {
                timeout: 5_000,
              })
              .toMatch(/^\\s*\\{/);
            const clipboardText = await page.evaluate(async () => navigator.clipboard.readText());
            return JSON.parse(clipboardText) as {
          '''
          new = '''async function copyGraphJson(page: Page) {
            page.once("dialog", async (dialog) => {
              await dialog.accept();
            });

            await page.evaluate(() => {
              const clipboardState = window as unknown as {
                __nodesCopiedGraphJson?: string;
              };
              clipboardState.__nodesCopiedGraphJson = "";
              Object.defineProperty(navigator, "clipboard", {
                configurable: true,
                value: {
                  writeText: async (text: string) => {
                    clipboardState.__nodesCopiedGraphJson = text;
                  },
                  readText: async () => clipboardState.__nodesCopiedGraphJson ?? "",
                },
              });
            });

            const blockLibrary = page.getByRole("complementary", { name: "Block library" });
            const collapseBlockLibrary = blockLibrary.getByRole("button", {
              name: "Collapse block library",
            });
            if (await collapseBlockLibrary.isVisible().catch(() => false)) {
              await collapseBlockLibrary.click();
              await expect(
                blockLibrary.getByRole("button", { name: "Expand block library" }),
              ).toBeVisible();
            }

            await page.getByRole("button", { name: "Fit View" }).click();
            const copyJsonButton = page.getByRole("button", { name: "Copy JSON" });
            await expect(copyJsonButton).toBeVisible();
            await copyJsonButton.click({ force: true });
            const readCopiedGraphJson = () =>
              page.evaluate(
                () =>
                  (window as unknown as { __nodesCopiedGraphJson?: string })
                    .__nodesCopiedGraphJson ?? "",
              );
            await expect.poll(readCopiedGraphJson, { timeout: 5_000 }).toMatch(/^\\s*\\{/);
            const clipboardText = await readCopiedGraphJson();
            return JSON.parse(clipboardText) as {
          '''
          assert old in source, "copyGraphJson source changed"
          source = source.replace(old, new, 1)

          old = '''  await targetNode
              .getByRole("button", { name: resolvedActionName })
              .evaluate((button: HTMLButtonElement) => button.click());
          '''
          new = '''  const actionButton = targetNode.getByRole("button", {
              name: resolvedActionName,
            });
            await expect(actionButton).toBeVisible();
            await actionButton.click({ force: true });
          '''
          assert old in source, "flow action helper changed"
          source = source.replace(old, new, 1)
          source = source.replace(
            '  const reply = `E2E reply: ${prompt}`;\n',
            '  const reply = `Mock Canvas branch response: ${prompt}`;\n',
            1,
          )

          old = '''  const branchChatRequests: string[] = [];
            page.on("request", (request) => {
              if (request.method() === "POST" && request.url().includes("/api/chat")) {
                branchChatRequests.push(request.url());
              }
            });
          '''
          new = '''  const branchRunRequests: string[] = [];
            page.on("request", (request) => {
              if (
                request.method() === "POST" &&
                request.url().includes("/api/canvas-branch-runs")
              ) {
                branchRunRequests.push(request.url());
              }
            });
          '''
          assert old in source, "branch request listener changed"
          source = source.replace(old, new, 1)
          source = source.replace(
            "  expect(branchChatRequests).toHaveLength(1);\n",
            "  expect(branchRunRequests).toHaveLength(1);\n",
            1,
          )

          old = '''  await page.route("**/api/chat", async (route) => {
              failedRequests += 1;
              await route.fulfill({
                status: 503,
                body: "The model provider is unavailable right now. Try again in a moment.",
                contentType: "text/plain",
                headers: {
                  "x-nodes-error-code": "provider_unavailable",
                  "x-nodes-error-message":
                    "The model provider is unavailable right now. Try again in a moment.",
                },
              });
            });
          '''
          new = '''  await page.route("**/api/canvas-branch-runs", async (route) => {
              failedRequests += 1;
              await route.fulfill({
                status: 503,
                body: JSON.stringify({
                  error: {
                    message:
                      "The model provider is unavailable right now. Try again in a moment.",
                  },
                }),
                contentType: "application/json",
              });
            });
          '''
          assert old in source, "rollback route changed"
          source = source.replace(old, new, 1)

          old = '''  await targetNode
              .getByRole("button", { name: "Create sibling branch" })
              .evaluate((button: HTMLButtonElement) => button.click());
          '''
          new = '''  const branchButton = targetNode.getByRole("button", {
              name: "Create sibling branch",
            });
            await expect(branchButton).toBeVisible();
            await branchButton.click({ force: true });
          '''
          assert old in source, "rollback branch button changed"
          source = source.replace(old, new, 1)

          source = source.replace(
            '''  const failedResponsePromise = page.waitForResponse(
              (response) => response.url().includes("/api/chat") && response.request().method() === "POST",
            );
          ''',
            '''  const failedResponsePromise = page.waitForResponse(
              (response) =>
                response.url().includes("/api/canvas-branch-runs") &&
                response.request().method() === "POST",
            );
          ''',
            1,
          )
          source = source.replace(
            '  await page.unroute("**/api/chat");\n',
            '  await page.unroute("**/api/canvas-branch-runs");\n',
            1,
          )
          source = source.replace(
            '''  const retryResponsePromise = page.waitForResponse(
              (response) => response.url().includes("/api/chat") && response.request().method() === "POST",
            );
          ''',
            '''  const retryResponsePromise = page.waitForResponse(
              (response) =>
                response.url().includes("/api/canvas-branch-runs") &&
                response.request().method() === "POST",
            );
          ''',
            1,
          )

          old = '''  await page
              .locator(".react-flow__node")
              .filter({ hasText: /Project Arena branch synthesis/i })
              .last()
              .click({ force: true });
          '''
          new = '''  const mergeNode = page
              .locator(".react-flow__node")
              .filter({ hasText: /Project Arena branch synthesis/i })
              .last();
            await expect(mergeNode).toBeVisible();
            await mergeNode
              .getByText(/Project Arena branch synthesis/i)
              .first()
              .click({ force: true });
          '''
          assert old in source, "Arena merge-node selection changed"
          source = source.replace(old, new, 1)

          path.write_text(source)
          Path(".github/workflows/apply-pr125-e2e-fixes.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/smoke.spec.ts .github/workflows/apply-pr125-e2e-fixes.yml
          git commit -m "test(e2e): align Canvas branch integration coverage"
          git push origin HEAD:maintenance/final-dependency-integration
