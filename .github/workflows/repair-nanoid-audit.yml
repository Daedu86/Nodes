name: Repair nanoid audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-nanoid-audit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Repair only the vulnerable Nano ID lock entry
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          npm ci --no-audit --fund=false
          npm audit fix --package-lock-only --omit=dev --ignore-scripts
          node <<'NODE'
          const fs = require('node:fs')
          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json', 'utf8'))
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const key = 'node_modules/nanoid'
          const oldNanoid = before.packages?.[key]
          const newNanoid = after.packages?.[key]
          if (oldNanoid?.version !== '3.3.17') {
            throw new Error(`Expected nanoid 3.3.17 before repair, got ${oldNanoid?.version ?? 'missing'}`)
          }
          if (newNanoid?.version !== '3.3.18') {
            throw new Error(`Expected nanoid 3.3.18 after repair, got ${newNanoid?.version ?? 'missing'}`)
          }
          delete before.packages[key]
          delete after.packages[key]
          if (JSON.stringify(before) !== JSON.stringify(after)) {
            throw new Error('npm audit fix changed package-lock content outside node_modules/nanoid')
          }
          NODE
          git diff --exit-code -- package.json
          npm ci --no-audit --fund=false
          npm audit --omit=dev --audit-level=high

      - name: Commit repaired lockfile and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/repair-nanoid-audit.yml
          git add -- package-lock.json
          git diff --cached --check
          git commit -m "fix(deps): update nanoid to 3.3.18"
          git push origin HEAD:main
