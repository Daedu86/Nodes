name: Apply runtime event ingestion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-runtime-event-ingestion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply exact source transformations
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/apply-runtime-ingestion.cjs
          node /tmp/apply-runtime-ingestion.cjs

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --fund=false
          node --check services/runtime-event-sink.mjs
          node --check services/codex-runner/server.mjs
          node --check services/nooa-runner/server.mjs
          npm run typecheck
          npx vitest run tests/runtime-event-sink.test.js tests/agent-stream-journal.test.ts
          npm run audit:production
          git diff --check

      - name: Commit implementation and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/apply-runtime-event-ingestion.yml
          git add -- \
            .env.example \
            app/api/agents/runtime-events/route.ts \
            lib/agents/codex/runner-client.ts \
            lib/agents/nooa/runner-client.ts \
            lib/server/agent-runtime-event-sink-url.ts \
            services/codex-runner/server.mjs \
            services/nooa-runner/server.mjs \
            services/runtime-event-sink.mjs \
            tests/runtime-event-sink.test.js
          git diff --cached --check
          git commit -m "feat(agents): add server-owned runtime event ingestion"
          git push origin HEAD:main
