name: Harden runtime event ingestion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harden-runtime-event-ingestion.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply single-writer hardening
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/harden-runtime-event-ingestion.cjs
          node scripts/harden-runtime-event-ingestion.cjs

      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --fund=false
          node --check services/runtime-event-sink.mjs
          node --check services/codex-runner/server.mjs
          node --check services/nooa-runner/server.mjs
          npm run typecheck
          npx vitest run tests/runtime-event-sink.test.js tests/agent-stream-journal.test.ts
          npm run audit:production
          git diff --check

      - name: Commit hardening and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/harden-runtime-event-ingestion.yml scripts/harden-runtime-event-ingestion.cjs
          git add -- \
            lib/agents/kernel/session-log.ts \
            lib/server/agent-runtime-request.ts \
            lib/server/agent-runtime-event-sink-url.ts \
            lib/server/agent-stream-journal.ts \
            services/runtime-event-sink.mjs \
            lib/agents/codex/runner-client.ts \
            lib/agents/nooa/runner-client.ts \
            tests/agent-stream-journal.test.ts \
            tests/runtime-event-sink.test.js
          git diff --cached --check
          git commit -m "fix(agents): enforce single-writer runtime journals"
          git push origin HEAD:main
