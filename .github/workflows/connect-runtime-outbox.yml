name: Connect durable runtime outbox

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/connect-runtime-outbox.yml

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply exact runner changes
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/connect-runtime-outbox.cjs
          node scripts/connect-runtime-outbox.cjs

      - name: Validate durable outbox
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --fund=false
          node --check services/runtime-event-sink.mjs
          node --check services/codex-runner/server.mjs
          node --check services/nooa-runner/server.mjs
          npm run typecheck
          npx vitest run tests/runtime-event-sink.test.js tests/agent-stream-journal.test.ts
          npm run audit:production
          git diff --check

      - name: Commit implementation and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/connect-runtime-outbox.yml scripts/connect-runtime-outbox.cjs
          git add -- \
            .env.example \
            services/codex-runner/server.mjs \
            services/nooa-runner/server.mjs
          git diff --cached --check
          git commit -m "feat(agents): connect durable runtime event outbox"
          git push origin HEAD:main
